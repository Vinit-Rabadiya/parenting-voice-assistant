name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: test-project
      FIREBASE_ADMIN_KEY_PATH: .secrets/firebase-admin.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: ruff check .

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest

      - name: Evaluate child danger-sign routing
        run: python -m scripts.evaluate_safety --check --output safety-report.json

      - name: Upload safety evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-evaluation
          path: safety-report.json
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build
