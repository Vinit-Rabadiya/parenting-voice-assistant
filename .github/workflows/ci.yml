name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  secret-checks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location "$release/$archive" -o "$RUNNER_TEMP/gitleaks/$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/gitleaks/checksums.txt"
          cd "$RUNNER_TEMP/gitleaks"
          grep "  $archive$" checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks

      - name: Scan new commits for secrets
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SCAN_HEAD" =~ ^[0-9a-f]{40}$ ]]
          if [[ -z "$SCAN_BASE" || "$SCAN_BASE" =~ ^0{40}$ ]]; then
            range="$SCAN_HEAD"
          else
            [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]]
            range="$SCAN_BASE..$SCAN_HEAD"
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="$range" .

  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: test-project
      FIREBASE_ADMIN_KEY_PATH: .secrets/firebase-admin.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: ruff check .

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest

      - name: Evaluate child danger-sign routing
        run: python -m scripts.evaluate_safety --check --output safety-report.json

      - name: Evaluate English-only language boundary
        run: python -m scripts.evaluate_language_safety --check --output language-safety-report.json

      - name: Verify fixture-corpus age filtering
        run: pytest -q tests/test_retrieval_evaluation.py -k fixture_corpus

      - name: Set up Node.js for API workflow integration
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend and backend conversation workflow
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run test:workflow

      - name: Upload safety evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-evaluation
          path: |
            safety-report.json
            language-safety-report.json
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: |
          npm run test:dependencies
          npm run test:audio
          npm run test:ui -- --exclude tests/frontend/ConversationWorkflow.test.jsx

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build
