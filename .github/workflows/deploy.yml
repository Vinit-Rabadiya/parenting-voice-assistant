name: Deploy Application

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deployment operation
        required: true
        default: publish
        type: choice
        options: [publish, start, stop]

permissions:
  contents: read

# Serialize deployment and operator actions so their Azure changes cannot overlap.
concurrency:
  group: parenting-deployment
  cancel-in-progress: false

jobs:
  select-commit:
    if: >-
      vars.DEPLOYMENT_AUTOMATION_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      operation: ${{ steps.commit.outputs.operation }}
      ready: ${{ steps.commit.outputs.ready }}
    steps:
      - name: Select a checked main commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OPERATION: ${{ inputs.action || 'automatic' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          if [[ "$OPERATION" == stop ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$CANDIDATE_SHA" != "$current_sha" ]]; then
            echo "A newer main commit exists; this deployment is skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          successful_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$CANDIDATE_SHA&per_page=1" \
            --jq '.workflow_runs | length')
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "::error::Wait for CI Pipeline to pass on this main commit before publishing or starting."
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: select-commit
    if: needs.select-commit.outputs.ready == 'true' && needs.select-commit.outputs.operation != 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - name: Validate browser configuration
        id: image
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Set repository Actions variable $key before publishing."
              exit 1
            fi
          done
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up the image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the private image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ needs.select-commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.select-commit.outputs.sha }}
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=parenting-container
          cache-to: type=gha,scope=parenting-container,mode=max

  update-application:
    needs: [select-commit, publish-image]
    if: >-
      !cancelled() && vars.AZURE_DEPLOY_ENABLED == 'true' &&
      needs.select-commit.outputs.ready == 'true' &&
      (needs.select-commit.outputs.operation == 'stop' ||
       (needs.publish-image.result == 'success' && needs.select-commit.outputs.operation != 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update or stop the application
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          OPERATION: ${{ needs.select-commit.outputs.operation }}
          COMMIT_SHA: ${{ needs.select-commit.outputs.sha }}
          IMAGE_REF: ${{ needs.publish-image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP.}"
          : "${CONTAINER_APP:?Set AZURE_CONTAINER_APP.}"
          az extension add --name containerapp --upgrade --only-show-errors
          resource_id=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query id --output tsv)
          app_url="https://management.azure.com$resource_id"
          api_version=2025-07-01
          read_state() {
            az rest --method get --url "$app_url?api-version=$api_version" --query properties.runningStatus --output tsv
          }
          wait_for_state() {
            for attempt in {1..24}; do
              if [[ "$(read_state)" == "$1" ]]; then return 0; fi
              sleep 5
            done
            echo "::error::The application did not reach state $1. Check Azure before continuing."
            return 1
          }
          if [[ "$OPERATION" == stop ]]; then
            az rest --method post --url "$app_url/stop?api-version=$api_version" --output none
            wait_for_state Stopped
            echo "The application is stopped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$COMMIT_SHA" != "$current_sha" ]]; then
            echo "A newer main commit exists; this deployment is skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state=$(read_state)
          if [[ "$OPERATION" == automatic && "$state" == Stopped ]]; then
            echo "Image published. The application remains stopped; use Start to apply this image when needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$state" == Stopped && "$OPERATION" == start ]]; then
            az rest --method post --url "$app_url/start?api-version=$api_version" --output none
            wait_for_state Running
          elif [[ "$state" != Running ]]; then
            echo "::error::The application is $state. Wait for its current operation before retrying."
            exit 1
          fi
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE_REF" --output none
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          [[ "$fqdn" =~ ^[a-z0-9.-]+\.azurecontainerapps\.io$ ]]
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 15 \
            "https://$fqdn/api/health/live" > /dev/null
          echo "Application updated to commit $COMMIT_SHA. HTTPS health check passed." >> "$GITHUB_STEP_SUMMARY"
