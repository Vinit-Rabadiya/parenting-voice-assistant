# Local verification only. Hosted deployments use reviewed HTTPS and host settings.
services:
  app:
    image: parenting-voice-assistant:demo-local
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Firebase web configuration is required}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Firebase web configuration is required}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Firebase web configuration is required}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Firebase web configuration is required}
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      APP_ENV: development
      FIREBASE_USE_ADC: "false"
      FIREBASE_ADMIN_KEY_PATH: /run/secrets/firebase-admin.json
      STT_MODEL: base
      HF_HUB_OFFLINE: "1"
      SERVE_FRONTEND: "true"
    secrets:
      - source: firebase_admin
        target: firebase-admin.json
    restart: "no"
    stop_grace_period: 60s

secrets:
  firebase_admin:
    file: ${FIREBASE_ADMIN_KEY_PATH:?Firebase Admin key file path is required for local verification}
